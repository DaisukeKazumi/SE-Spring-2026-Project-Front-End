<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Comm's Your Alternative Comms Application</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- ===== HEADER ===== -->
    <header>
      <div class="header-inner">
        <h1>Comm's</h1>
        <nav>
          <span id="user-info" class="user-info"></span>
          <button id="logout-btn" class="btn btn-secondary hidden">Log out</button>
        </nav>
      </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <main>

      <!-- Auth section (hidden after login) -->
      <section id="auth-section" class="card">
        <h2>Sign Up / Log In</h2>

        <form id="auth-form">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required />

          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required />

          <div class="btn-group">
            <button type="button" id="signup-btn" class="btn btn-primary">Sign Up</button>
            <button type="button" id="login-btn"  class="btn btn-secondary">Log In</button>
          </div>
        </form>

        <p id="auth-message" class="message"></p>
      </section>

      <!-- Username prompt (shown after login if username is not set) -->
      <div id="username-overlay" class="overlay hidden">
        <div class="card overlay-card">
          <h2>Choose a Username</h2>
          <p>Pick a unique username (at least 3 characters).</p>
          <form id="username-form">
            <label for="username-input">Username</label>
            <input type="text" id="username-input" placeholder="e.g. cooluser42" required minlength="3" />
            <button type="submit" id="username-submit-btn" class="btn btn-primary">Save Username</button>
          </form>
          <p id="username-message" class="message"></p>
        </div>
      </div>

      <!-- Post edit modal -->
      <div id="edit-post-overlay" class="overlay hidden">
        <div class="card overlay-card">
          <h2>Edit Post</h2>
          <form id="edit-post-form">
            <label for="edit-post-input">Content</label>
            <textarea id="edit-post-input" class="post-textarea" rows="4" required></textarea>
            <div class="word-counter" id="edit-word-counter">0 / 1024 words</div>
            <div class="btn-group">
              <button type="submit" class="btn btn-primary">Save</button>
              <button type="button" id="edit-post-cancel" class="btn btn-secondary">Cancel</button>
            </div>
          </form>
          <p id="edit-post-message" class="message"></p>
        </div>
      </div>

      <!-- Create post section (visible after login) -->
      <section id="create-post-section" class="card hidden">
        <h2>Create a Post</h2>

        <form id="insert-form">
          <label for="data-input">What's on your mind?</label>
          <textarea id="data-input" class="post-textarea" rows="3" placeholder="Write your post…" required></textarea>
          <div class="word-counter" id="word-counter">0 / 1024 words</div>
          <button type="submit" class="btn btn-primary">Post</button>
        </form>

        <p id="data-message" class="message"></p>
      </section>

      <!-- Public feed (always visible) -->
      <section id="feed-section">
        <h2 class="feed-title">Public Feed</h2>
        <div id="feed-list" class="feed-list">
          <p class="feed-empty">Loading posts…</p>
        </div>
      </section>

    </main>

    <!-- ===== FOOTER ===== -->
    <footer>
      <p>&copy; All Rights Reserved by Comm's.</p>
    </footer>

    <!-- Supabase JS client (CDN — no build step required) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- App logic -->
    <script src="script.js"></script>

  </body>
</html>
